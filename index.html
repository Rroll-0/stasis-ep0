<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="STASIS" />
  <meta name="theme-color" content="#0a0c10" />
  <meta name="description" content="STASIS Episode 0 — text RPG. Wake in the tube." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="./styles.css" />
  <title>STASIS — Episode 0</title>
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div id="title">STASIS — Episode 0</div>
      <div id="status" aria-live="polite"></div>
      <button type="button" id="btn-new" title="New campaign">New</button>
    </header>
    <main id="log" role="log" aria-live="polite" aria-relevant="additions"></main>
    <form id="cmd-form" autocomplete="off">
      <input
        id="cmd"
        type="text"
        enterkeyhint="send"
        autocapitalize="none"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
        placeholder="look · examine stencil · hatch · talk voss who"
        aria-label="Command"
      />
      <button type="submit" id="btn-send">Send</button>
    </form>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
